format = """
${custom.ZMX_SESSION}\
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$status$character"""

[custom.ZMX_SESSION]
command = "printf '%s' \"$ZMX_SESSION\" | cut -c1-13"
when = "test -n \"$ZMX_SESSION\""
symbol = " "
format = "[$symbol$output]($style) in "
description = "zmx session name (shortened)"
style = "bold blue"

[username]
style_user = "bold yellow"
style_root = "bold red"
format = "as [$user]($style) "
disabled = false
show_always = false

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold bright-purple)"

[status]
disabled = false
format = '[\[$status\]]($style)'
style = 'bold bright-purple'

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = " "
format = " on [$symbol$branch]($style)"
style = "bold purple"

[git_status]
format = '( [\[$all_status$ahead_behind\]]($style))'
style = "bold red"
