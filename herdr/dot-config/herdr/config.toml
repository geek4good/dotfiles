# herdr configuration
# Stow-managed: herdr/dot-config/herdr/config → ~/.config/herdr/config
#
# Design:
#   - Prefix: ctrl+space (matches Ghostty split-creation prefix)
#   - ctrl+alt+j/k: cycle workspaces (spaces) directly
#   - ctrl+alt+h/l: cycle tabs directly
#   - prefix + h/j/k/l: Herdr-internal pane focus
#   - Ghostty passes these through (no competing Ghostty bindings)
#   - Agents resume into their native sessions after Herdr restart

onboarding = false

[theme]
name = "terminal"

[terminal]
shell_mode = "auto"

[update]
channel = "stable"

[keys]
# ─── Prefix ───────────────────────────────────────────────────────────────
# Matches Ghostty's ctrl+space prefix for split creation.
# Direct pane navigation: ctrl+h/j/k/l (no prefix needed).
prefix = "ctrl+space"

# ─── Pane focus (within Herdr) ───────────────────────────────────────────
# ctrl+h/j/k/l now route through the vim-herdr-navigation plugin (see
# [[keys.command]] below): forwards to Neovim when it's focused, else moves
# Herdr focus. Plugin: `herdr plugin install paulbkim-dev/vim-herdr-navigation`.

# ─── Pane splitting ──────────────────────────────────────────────────────
# split_vertical uses the 0.8 default: prefix+v
# split_horizontal: default prefix+- plus explicit prefix+s
split_horizontal = ["prefix+minus", "prefix+s"]

# ─── Pane lifecycle ──────────────────────────────────────────────────────
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
rename_pane = "prefix+shift+p"

# ─── Tabs ────────────────────────────────────────────────────────────────
new_tab = "prefix+c"
next_tab = "ctrl+alt+l"
previous_tab = "ctrl+alt+h"
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

# ─── Workspaces ──────────────────────────────────────────────────────────
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Direct shortcuts — cycle/select workspaces without prefix
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"
switch_workspace = "ctrl+alt+1..9"

# ─── Navigation mode (within sidebar/pane list) ─────────────────────────
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# ─── Session ─────────────────────────────────────────────────────────────
detach = "prefix+q"

# ─── UI ──────────────────────────────────────────────────────────────────
toggle_sidebar = "prefix+b"
goto = "prefix+g"
help = "prefix+?"

# ─── Navigate-mode cycling ───────────────────────────────────────────────
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+backtick"

# ─── Settings / reload ──────────────────────────────────────────────────
settings = "prefix+shift+s"
reload_config = "prefix+shift+r"

# ─── Notifications ──────────────────────────────────────────────────────
open_notification_target = "prefix+o"

# ─── Copy mode ──────────────────────────────────────────────────────────
copy_mode = "prefix+["

# ─── Scrollback ─────────────────────────────────────────────────────────
edit_scrollback = "prefix+e"

# ─── Worktrees ──────────────────────────────────────────────────────────
new_worktree = "prefix+shift+g"

# ─── Clear screen ─────────────────────────────────────────────────────────
# prefix+shift+l (ctrl+space, then L) sends ctrl+l (clear) to the focused pane
# via send-keys, bypassing Herdr's ctrl+l=focus_pane_right interception.
# Single-chord ctrl+shift+l is unusable: Ghostty converts it to \x0c before
# Herdr sees it, and Herdr reads \x0c as ctrl+l (focus_pane_right).
[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"

# ─── Vim/Herdr pane navigation (ctrl+h/j/k/l) ───────────────────────────
# Forwards the chord to Neovim when it's the focused process (so splits move),
# otherwise moves Herdr's pane focus. Neovim hands back to Herdr at split edges.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
sidebar_width = 26
mouse_capture = true
confirm_close = true
prompt_new_tab_name = true
show_agent_labels_on_pane_borders = true
accent = "cyan"

[ui.toast]
# Show in-app toasts when agents finish or need input in background tabs.
delivery = "herdr"

[ui.sound]
enabled = false

[session]
# Resume agent conversations (Pi, Claude Code, etc.) after Herdr restart.
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = false
allow_nested = false
kitty_graphics = false

[advanced]
scrollback_limit_bytes = 10485760
