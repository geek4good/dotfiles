# herdr configuration
# Stow-managed: herdr/dot-config/herdr/config → ~/.config/herdr/config
#
# Design:
#   - Prefix: ctrl+space (matches Ghostty split-creation prefix)
#   - ctrl+alt+j/k: cycle workspaces (spaces) directly
#   - ctrl+alt+h/l: cycle tabs directly
#   - prefix + h/j/k/l: Herdr-internal pane focus
#   - Ghostty passes these through (no competing Ghostty bindings)
#   - Agents resume into their native sessions after Herdr restart

onboarding = false

[theme]
name = "terminal"

[terminal]
shell_mode = "auto"

[update]
channel = "stable"

[keys]
# ─── Prefix ───────────────────────────────────────────────────────────────
# Matches Ghostty's ctrl+space prefix for split creation.
# Direct pane navigation: ctrl+h/j/k/l (no prefix needed).
prefix = "ctrl+space"

# ─── Pane focus (within Herdr) ───────────────────────────────────────────
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# ─── Pane splitting ──────────────────────────────────────────────────────
split_vertical = "prefix+l"
split_horizontal = "prefix+j"

# ─── Pane lifecycle ──────────────────────────────────────────────────────
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
rename_pane = "prefix+shift+p"

# ─── Tabs ────────────────────────────────────────────────────────────────
new_tab = "prefix+t"
next_tab = ["prefix+n", "ctrl+alt+l"]
previous_tab = ["prefix+p", "ctrl+alt+h"]
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

# ─── Workspaces ──────────────────────────────────────────────────────────
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Direct shortcuts — cycle/select workspaces without prefix
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"
switch_workspace = "ctrl+alt+1..9"

# ─── Navigation mode (within sidebar/pane list) ─────────────────────────
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# ─── Session ─────────────────────────────────────────────────────────────
detach = "prefix+q"

# ─── UI ──────────────────────────────────────────────────────────────────
toggle_sidebar = "prefix+b"
goto = "prefix+g"
help = "prefix+?"

# ─── Navigate-mode cycling ───────────────────────────────────────────────
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+backtick"

# ─── Settings / reload ──────────────────────────────────────────────────
settings = "prefix+s"
reload_config = "prefix+shift+r"

# ─── Notifications ──────────────────────────────────────────────────────
open_notification_target = "prefix+o"

# ─── Clear screen ─────────────────────────────────────────────────────────
# ctrl+shift+l sends ctrl+l (clear) to the focused pane via send-keys,
# bypassing Herdr's ctrl+l=focus_pane_right interception.
[[keys.command]]
key = "ctrl+shift+l"
type = "shell"
command = "herdr pane send-keys $(herdr pane list | jq -r '.result.panes[] | select(.focused==true).pane_id') ctrl+l"

# ─── Copy mode ──────────────────────────────────────────────────────────
copy_mode = "prefix+["

# ─── Scrollback ─────────────────────────────────────────────────────────
edit_scrollback = "prefix+e"

# ─── Worktrees ──────────────────────────────────────────────────────────
new_worktree = "prefix+shift+g"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
sidebar_width = 26
mouse_capture = true
confirm_close = true
prompt_new_tab_name = true
show_agent_labels_on_pane_borders = true
accent = "cyan"

[ui.toast]
# Show in-app toasts when agents finish or need input in background tabs.
delivery = "herdr"

[ui.sound]
enabled = false

[session]
# Resume agent conversations (Pi, Claude Code, etc.) after Herdr restart.
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = false
allow_nested = false
kitty_graphics = false

[advanced]
scrollback_limit_bytes = 10485760
