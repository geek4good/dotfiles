# Dotfiles deployment — one group per package (former GNU Stow packages).
# Apply: mise -C ~/Projects/dotfiles dot apply   (or ./sync)
# Per-machine selection: [bootstrap] dotfile_groups in ~/.config/mise/config.local.toml
#
# Default excludes mirror the old .stow-local-ignore (depth-independent:
# .gitignore/README.md were never deployed by stow either).

[settings]
experimental = true
dotfiles.root = "~/Projects/dotfiles"
dotfiles.relative_symlinks = true

[dotfile_groups.aerospace]
root = "aerospace"
dot_prefix = true
exclude = [".DS_Store", ".git", ".gitignore", "README.md"]

[dotfile_groups.aws]
root = "aws"
dot_prefix = true
exclude = [".DS_Store", ".git", ".gitignore", "README.md"]

