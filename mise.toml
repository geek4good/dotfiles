# Machine bootstrap declarations (packages, tools, agents, hooks).
# File deployment is NOT here anymore: dotfiles are tracked in place by
# `mise dot` and synced across machines via the setup origin (setup.git) —
# see ~/.config/mise/config.toml. The per-app directories in this repo
# (zsh/, fish/, nvim/, …) are the pre-track archive, kept for reference.

[settings]
experimental = true

# Runs around `mise dot apply` (and the dotfiles step of `mise bootstrap`).
[bootstrap.hooks]
# Ingest skills installed via `npx skills ...` into the repo before deploying
pre-dotfiles = "{{ config_root }}/bin/dot-local/bin/dotfiles-sync-skills"
# Re-apply Pi local customizations after deployment (parity with old ./sync)
post-dotfiles = '[ -x "$HOME/.pi/agent/post-update.sh" ] && "$HOME/.pi/agent/post-update.sh" || true'


