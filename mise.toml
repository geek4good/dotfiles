# ─── Machine bootstrap ─────────────────────────────────────────────────────
# Fresh machine: install mise (mise.jdx.dev), clone this repo, then:
#   cd ~/Projects/dotfiles && mise trust && mise bootstrap
# Daily/unattended runs: add --skip-dirty (this repo is often intentionally
# dirty — drift lands here through symlinks; see ./sync drift report).

[bootstrap.repos]
"~/Projects/dotfiles" = { url = "git@github.com:geek4good/dotfiles.git", ref = "main" }

# Touch ID (pam_tid + pam_reattach, works inside tmux/zmx too). Root-owned:
# needs an interactive terminal once; unattended runs report it as follow-up.
# (First apply drops the cosmetic Apple template comment — no functional
# change to the two auth lines below.)
[bootstrap.files."/etc/pam.d/sudo_local"]
os = "macos"
mode = "0644"
content = """
auth       optional       pam_reattach.so
auth       sufficient     pam_tid.so
"""

# Remove merged-PR worktrees + close their Herdr workspaces every 15 min
# (was com.geek4good.pr-worktree-clean.plist; label is now dev.mise.*)
[bootstrap.macos.launchd.agents.pr-worktree-clean]
program = "~/.local/bin/pr-worktree-clean"
args = ["--quiet"]
start_interval = 900
stdout_path = "~/Library/Logs/pr-worktree-clean.log"
stderr_path = "~/Library/Logs/pr-worktree-clean.log"

# Secrets/identity provisioning (age identity, GPG import, cloudflared creds)
[tasks.bootstrap]
run = "{{ config_root }}/bin/dot-local/bin/bootstrap-extras"
